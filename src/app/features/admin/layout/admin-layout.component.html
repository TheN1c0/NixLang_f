<div class="admin-layout-wrapper" [class.sidebar-hidden]="sidebarCollapsed()">
  
  <!-- Sidebar -->
  <aside class="admin-sidebar" role="navigation" aria-label="Menú administrativo">
    <div class="sidebar-brand" routerLink="/admin/lessons" style="cursor: pointer;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="brand-logo" aria-hidden="true">
        <circle cx="24" cy="24" r="22" stroke="var(--color-primary)" stroke-width="4" />
        <path d="M16 32V16L24 24L32 16V32" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="logo-text">NixLang <small class="admin-tag">Admin</small></span>
    </div>

    <div class="sidebar-menu">
      
      <!-- GENERAL SECTION -->
      <div class="menu-section">
        <span class="menu-section-title">General</span>
        <a routerLink="/lessons" class="menu-item student-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="menu-icon">
            <path d="M480-120 120-360v-240l360-240 360 240v240L480-120Zm0-120 280-187v-93L480-313 200-500v93l280 187Zm0-333 280-187-280-187-280 187 280 187Z"/>
          </svg>
          <span class="menu-text">Vista Estudiante</span>
        </a>
      </div>

      <!-- CONTENIDO SECTION -->
      <div class="menu-section">
        <span class="menu-section-title">Contenido</span>
        
        <a routerLink="/admin/lessons" routerLinkActive="active" class="menu-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="menu-icon">
            <path d="M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T760-80H240Zm0-80h520v-400H520v-240H240v640Zm280-400h200L520-760v200H240h280Z"/>
          </svg>
          <span class="menu-text">Lecciones</span>
        </a>

        <a routerLink="/admin/exercises" routerLinkActive="active" class="menu-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="menu-icon">
            <path d="M160-120v-80h640v80H160Zm200-160v-400h240v400H360Zm80-80h80v-240h-80v240Zm-280-80v-80h160v80H160Zm480 0v-80h160v80H640Z"/>
          </svg>
          <span class="menu-text">Ejercicios</span>
        </a>

        <a routerLink="/admin/categories" routerLinkActive="active" class="menu-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="menu-icon">
            <path d="M300-80q-58 0-99-41t-41-99v-520q0-58 41-99t99-41h400q58 0 99 41t41 99v520q0 58-41 99t-99 41H300Zm0-80h400q25 0 42.5-17.5T760-220v-520q0-25-17.5-42.5T700-800H300q-25 0-42.5 17.5T240-750v520q0 25 17.5 42.5T300-160Zm60-120h280v-80H360v80Zm0-160h280v-80H360v80Zm0-160h280v-80H360v80Z"/>
          </svg>
          <span class="menu-text">Categorías</span>
        </a>

      </div>

    </div>

    <!-- Toggle button footer -->
    <div class="sidebar-footer">
      <button class="toggle-sidebar-btn" (click)="toggleSidebar()" aria-label="Colapsar sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="toggle-icon">
          <path d="M440-240 200-480l240-240 56 56-184 184 184 184-56 56Zm262 0L462-480l240-240 56 56-184 184 184 184-56 56Z"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Right Side Area -->
  <div class="admin-main-wrapper">
    
    <!-- Header -->
    <header class="admin-header" role="banner">
      <div class="header-left">
        <button class="mobile-toggle-btn" (click)="toggleSidebar()" aria-label="Mostrar menú">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="hamburger-icon">
            <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
          </svg>
        </button>
        <h1 class="header-title">Panel de Administración</h1>
      </div>

      <div class="header-right">
        
        <!-- Mock Notifications -->
        <button class="notif-btn" aria-label="Notificaciones">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="notif-icon">
            <path d="M160-200v-80h80v-280q0-83 50-147.5T420-712v-28q0-25 17.5-42.5T480-800q25 0 42.5 17.5T540-740v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80Z"/>
          </svg>
          <span class="notif-badge">3</span>
        </button>

        <!-- Profile Dropdown -->
        <div class="profile-container">
          @if (userService.profile(); as user) {
            <button 
              class="profile-trigger" 
              (click)="toggleProfileMenu()"
              [attr.aria-expanded]="profileMenuOpen()"
              aria-haspopup="true"
              aria-label="Menú de administrador">
              <span class="avatar-circle" aria-hidden="true">
                {{ user.fullName.charAt(0).toUpperCase() }}
              </span>
              <span class="profile-name">{{ user.fullName }}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="chevron-icon" aria-hidden="true">
                <path d="M480-344 240-584h480L480-344Z"/>
              </svg>
            </button>

            @if (profileMenuOpen()) {
              <div class="profile-dropdown" role="menu">
                <div class="dropdown-header">
                  <p class="user-fullname">{{ user.fullName }}</p>
                  <p class="user-role">Administrador</p>
                </div>
                <div class="dropdown-divider" role="separator"></div>
                <button class="dropdown-item logout-btn" (click)="logout()" role="menuitem">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="logout-icon" aria-hidden="true">
                    <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm384-244-56-56 102-102H360v-80h270L528-708l56-56 200 200-200 200Z"/>
                  </svg>
                  <span>Cerrar sesión</span>
                </button>
              </div>
            }
          }
        </div>

      </div>
    </header>

    <!-- Main Content Area -->
    <main class="admin-content-view">
      <div class="admin-content-inner">
        <router-outlet />
      </div>
    </main>

  </div>

</div>
