<div class="lesson-card" (click)="onStart()" [class.card-completed]="lesson.status === 'Completada'">
  
  <!-- Header row: Level Badge & Favorite Star -->
  <div class="card-header">
    <span class="level-badge" [class]="'level-' + lesson.referenceLevel.toLowerCase()">
      Nivel {{ lesson.referenceLevel }}
    </span>
    
    <button 
      class="favorite-toggle" 
      [class.is-favorite]="lesson.isFavorite"
      (click)="onToggleFavorite($event)"
      [attr.aria-label]="lesson.isFavorite ? 'Quitar de favoritos' : 'Marcar como favorito'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="star-icon" aria-hidden="true">
        @if (lesson.isFavorite) {
          <!-- Filled Star -->
          <path d="m233-120 65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Z"/>
        } @else {
          <!-- Outlined Star -->
          <path d="m354-287 126-76 126 77-33-144 111-96-146-13-58-136-58 135-146 13 111 97-33 143ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Z"/>
        }
      </svg>
    </button>
  </div>

  <!-- Body row: Title & Description -->
  <div class="card-body">
    <h3 class="lesson-title">{{ lesson.title }}</h3>
    <p class="lesson-desc">{{ lesson.description }}</p>
  </div>

  <!-- Footer row: Progress / Completed Status & Action Button -->
  <div class="card-footer">
    
    <!-- Progress Indicator states -->
    @if (lesson.status === 'Completada') {
      <div class="status-indicator status-completed">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" class="check-icon" aria-hidden="true">
          <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
        </svg>
        <span>Completada</span>
      </div>
    } @else if (lesson.status === 'EnProgreso') {
      <div class="progress-container">
        <div class="progress-info">
          <span class="progress-label">Progreso</span>
          <span class="progress-val">{{ lesson.progressPercentage }}%</span>
        </div>
        <div class="progress-bar-bg" aria-hidden="true">
          <div class="progress-bar-fill" [style.width.%]="lesson.progressPercentage"></div>
        </div>
      </div>
    } @else {
      <div class="status-indicator status-not-started">
        <span>No iniciada</span>
      </div>
    }

    <!-- Action Action Button -->
    <button class="action-btn" [class.btn-outline]="lesson.status === 'Completada'" aria-label="Interactuar con la lección">
      @if (lesson.status === 'Completada') {
        Repasar
      } @else if (lesson.status === 'EnProgreso') {
        Reanudar
      } @else {
        Comenzar
      }
    </button>

  </div>

</div>
